<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推しキャッチ">
<meta name="description" content="推しのライブ・フェス・対バン情報を、まとめてキャッチ。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<title>推しキャッチ</title>
<style>
:root{--bg:#0b0b0b;--fg:#f2f2f2;--sub:#9a9a9a;--line:#2e2e2e;--line2:#4a4a4a;--w:#fff;--warn:#f5c04a;--hl:68%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--w);outline-offset:3px}
.bb{font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;letter-spacing:.03em;font-weight:400}
.wm{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ヘッダー */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.94);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.logo{font-size:19px;line-height:1;color:var(--w);text-decoration:none}
#nav{display:flex;align-items:center;gap:20px}
#nav button{font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:.08em;color:var(--sub);padding:6px 0;border-bottom:1px solid transparent}
#nav button.on{color:var(--w);border-bottom-color:var(--w)}
#nav button.add{color:var(--bg);background:var(--w);padding:3px 12px 2px;border-radius:2px;border:0}

/* 見出し・検索・推し */
.hero{padding-top:30px}
.hero h1{margin:0;font-size:clamp(52px,16vw,92px);line-height:.92;color:var(--w)}
.hero p{margin:10px 0 0;font-size:13px;color:var(--sub)}
.search{display:block;margin-top:22px}
#q{width:100%;font-size:16px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;outline:none}
#q::placeholder{color:#777}
#q:focus{border-bottom-color:var(--w)}
.chips{display:flex;flex-wrap:wrap;gap:10px 18px;margin:18px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);padding:3px 0;border-bottom:1px solid transparent;text-align:left;line-height:1.35}
.chip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,0) 85% var(--hl));flex:none}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--w);border-bottom-color:var(--w)}
.chip.pend{font-style:normal;border-bottom:1px dashed var(--line2)}
.chips.fold{max-height:66px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
#ctog{display:block;margin:6px 0 0;font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:.1em;color:var(--w);padding:4px 0;border-bottom:1px solid var(--w)}
#ctog[hidden]{display:none}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--w);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* 一覧 */
main{padding-bottom:70px}
.count{font-size:12px;color:var(--sub);margin:22px 0 0;letter-spacing:.04em}
.mon{display:flex;align-items:baseline;gap:10px;margin:34px 0 0;padding-bottom:8px;border-bottom:1px solid var(--w)}
.mon .n{font-size:40px;line-height:1;color:var(--w)}
.mon .j{font-size:14px;font-weight:700}
.mon .y{margin-left:auto;font-size:12px;color:var(--sub);letter-spacing:.08em}
.ev{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.date .dy{font-size:44px;line-height:.9;color:var(--w)}
.date .ym{font-size:10.5px;color:var(--sub);margin-top:5px;letter-spacing:.06em;line-height:1.35}
.date .to{font-size:11px;color:var(--sub);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;color:var(--sub);letter-spacing:.04em;margin-bottom:2px}
.tags .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,0) 85% var(--hl));display:inline-block;margin-right:6px;vertical-align:1px}
.tags .who{color:var(--fg);font-size:12px}
.pill{font-size:10.5px;padding:0 7px;border:1px solid var(--w);color:var(--w);border-radius:2px;line-height:1.7;letter-spacing:.04em}
.pill.solid{background:var(--w);color:var(--bg);font-weight:700}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.dim{border-color:var(--line2);color:var(--sub)}
.t{font-size:16px;font-weight:700;line-height:1.4;margin:3px 0 3px;color:var(--w);word-break:break-word}
.m{font-size:12.5px;color:var(--sub);margin:1px 0;word-break:break-word}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px}
.btn{display:inline-block;font-size:12.5px;color:var(--w);text-decoration:none;border:1px solid var(--w);padding:5px 14px;border-radius:2px;letter-spacing:.03em}
.btn:hover,.btn:active{background:var(--w);color:var(--bg)}
.lnk{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.empty{padding:50px 0 30px}
.empty .bb{font-size:52px;line-height:1;color:var(--w)}
.empty p{margin:8px 0 0;font-size:13px;color:var(--sub)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--sub);border:1px dashed var(--line2);padding:11px 12px;margin:22px 0 0;border-radius:2px}
.note b{color:var(--fg);font-weight:700}
.foot{font-size:11.5px;color:#777;margin:34px 0 0;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
.sk{height:96px;margin:0;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b0b0b 25%,#161616 37%,#0b0b0b 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 推しを追加（下から出るシート） */
#addbox{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#addbox[hidden]{display:none}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.72);animation:fade .2s}
@keyframes fade{from{opacity:0}}
#addform{position:relative;width:100%;max-width:560px;padding:22px 20px calc(24px + env(safe-area-inset-bottom));background:var(--bg);border:1px solid var(--line2);border-bottom:0;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#addform h2{margin:0;font-size:38px;line-height:1;color:var(--w)}
#addform p{margin:8px 0 18px;font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:14px;align-items:flex-end}
#addname{flex:1;min-width:0;font-size:16px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;outline:none}
#addname:focus{border-bottom-color:var(--w)}
#addgo{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.08em;color:var(--bg);background:var(--w);padding:4px 24px 2px;border-radius:2px}
#addgo:disabled{opacity:.5}
.x{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;color:var(--sub);padding:4px 8px}
#toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;max-width:min(92vw,520px);background:var(--w);color:var(--bg);padding:12px 18px;border-radius:2px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo wm" href="./" aria-label="推しキャッチ">推しキャッチ</a>
    <nav id="nav" aria-label="メニュー">
      <button data-nav="live" class="on">LIVE</button>
      <button data-nav="fes">FES</button>
      <button data-nav="add" class="add" aria-label="推しを追加">+ ADD</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1 class="bb" id="hero">LIVE<br>SCHEDULE</h1>
    <p id="herosub">推しのライブ・フェスを、まとめてキャッチ</p>
    <label class="search"><input id="q" type="search" placeholder="会場・公演名・地名で探す" autocomplete="off" aria-label="検索"></label>
    <div class="chips" id="chips" role="group" aria-label="推しで絞り込み"></div>
    <button type="button" id="ctog" hidden></button>
  </section>
  <main id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
</div>

<div id="addbox" hidden>
  <div class="bg" data-close></div>
  <form id="addform">
    <button type="button" class="x" data-close aria-label="閉じる">×</button>
    <h2 class="bb">ADD ARTIST</h2>
    <p>候補から選ぶと、すぐ表示されます。候補にない人は調べるので、1〜3分ほどかかります。</p>
    <div class="row"><input id="addname" list="sug" maxlength="60" placeholder="アーティスト名" autocomplete="off" enterkeyhint="send"><datalist id="sug"></datalist><button id="addgo" type="submit">ADD</button></div>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s), out=$('#out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?u:'';
const WE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const KIND={'フェス':'FES','ワンマン':'ONE MAN','対バン':'TAIBAN','イベント':'EVENT','その他':'OTHER'};
let DB={artists:[],events:[]}, sel=new Set();
try{sel=new Set(JSON.parse(localStorage.sel||'[]'))}catch{}
// 推しごとの目印の色（名前から決める。同じ名前はいつも同じ色）
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const todayJ=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10); // 日本時間の今日
function dinfo(d){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||'');if(!m)return null;
  const y=+m[1],mo=+m[2],dy=+m[3],t=/^(\d{4})-(\d\d)-(\d\d)$/.exec(todayJ());
  const left=Math.round((Date.UTC(y,mo-1,dy)-Date.UTC(+t[1],+t[2]-1,+t[3]))/864e5);
  return {y,mo,dy,w:new Date(y,mo-1,dy).getDay(),left}}
function dateBlock(d,end){
  const i=dinfo(d);if(!i)return `<div class="date"><div class="bb dy" style="font-size:26px">TBA</div><div class="ym">日付未定</div></div>`;
  let to='';const j=end&&end!==d?dinfo(end):null;
  if(j)to=`<div class="to">〜 ${j.mo===i.mo?'':j.mo+'/'}${j.dy}</div>`;
  return `<div class="date"><div class="bb dy">${i.dy}</div><div class="ym">${i.y}.${String(i.mo).padStart(2,'0')}<br>${WE[i.w]}</div>${to}</div>`;
}
function soonBadge(d){const i=dinfo(d);if(!i)return'';if(i.left===0)return '<span class="pill solid">TODAY</span>';if(i.left>0&&i.left<=14)return `<span class="pill">あと${i.left}日</span>`;return''}
// 推し追加：この画面から送信する（Googleフォームの受付口へ直接送る。別画面には移動しない）。
const FORM_POST='https://docs.google.com/forms/d/e/1FAIpQLScyDwwYaorGtzIDbylyTZa8qPfOZapT8wkfYOPNODXN4mmVBA/formResponse';
const ENTRY='entry.822980878';
let pend=[];try{pend=JSON.parse(localStorage.pend||'[]').map(p=>typeof p==='string'?{n:p,t:Date.now()}:p)}catch{}
const savePend=()=>{try{localStorage.pend=JSON.stringify(pend)}catch{}};
const nzName=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s'’"・.·\-_!！?？]/g,'');
// 登録済みの推し（正式名・別名）に一致するか。一致したら正式名を返す
function findArtist(name){
  const k=nzName(name);if(!k)return null;
  for(const a of DB.artists){if(nzName(a)===k)return a;
    for(const al of (DB.aliases&&DB.aliases[a])||[])if(nzName(al)===k)return a}
  return null;
}
const isRejected=name=>(DB.rejected||[]).some(r=>nzName(r)===nzName(name));
// カタログ：大きなフェス等の出演者を、事前に集めたもの。ここにいる推しは、追加した瞬間に表示できる
let CAT={artists:{}};
function findCatalog(name){
  const k=nzName(name);if(!k)return null;
  for(const [a,v] of Object.entries(CAT.artists||{})){if(nzName(a)===k)return a;
    for(const al of v.aliases||[])if(nzName(al)===k)return a}
  return null;
}
function catEvents(){ // 調べている最中の推しのうち、カタログにある分の予定
  const o=[];
  for(const p of pend){if(findArtist(p.n))continue;const ck=findCatalog(p.n);if(!ck)continue;
    for(const e of CAT.artists[ck].events||[])o.push({...e,artist:ck})}
  return o;
}
const allEv=()=>DB.events.concat(catEvents());
function fillSug(){
  const names=new Set([...DB.artists,...Object.keys(CAT.artists||{})]);
  $('#sug').innerHTML=[...names].sort((a,b)=>a.localeCompare(b,'ja')).slice(0,2000).map(n=>`<option value="${esc(n)}">`).join('');
}
function loadCat(){
  return fetch('data/catalog.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.artists){CAT=j;fillSug();render()}}).catch(()=>{});
}
const LATE=24*3600*1000; // 24時間たっても反映されない場合は注意を出す
// 推しの一覧：幅に合わせて折り返し、全員が見えるようにする
const chipEl=(a,extra='')=>`<button class="chip ${sel.has(a)?'on':''} ${extra}" data-a="${esc(a)}" style="--h:${hue(a)}"><i class="dot"></i>${esc(a)}</button>`;
// 一覧の畳む／開く：畳んでいる間は2行ぶんだけ見せる（選んでいる推しは先頭に出す）。開く／畳むは覚えておく
let OPEN=false;try{OPEN=localStorage.copen==='1'}catch{}
function foldChips(){
  const el=$('#chips'),btn=$('#ctog');
  if(TAB==='fes'){btn.hidden=true;return}
  el.classList.remove('fold');
  if(el.offsetHeight<=70){btn.hidden=true;return}   // 2行に収まるなら、畳む必要なし
  btn.hidden=false;
  if(OPEN)btn.textContent='CLOSE −';
  else{el.classList.add('fold');btn.textContent=`SHOW ALL ${DB.artists.length+pend.length} +`}
}
function chips(){
  pend=pend.filter(p=>!findArtist(p.n));savePend(); // データに載ったら「調査中」から外す
  const names=OPEN?DB.artists:[...DB.artists].sort((a,b)=>(sel.has(b)-sel.has(a)));
  $('#chips').innerHTML=`<button class="chip ${sel.size?'':'on'}" data-a="">ALL</button>`+
    names.map(a=>chipEl(a)).join('')+
    pend.map(p=>{const late=Date.now()-p.t>LATE||isRejected(p.n);const inCat=!late&&findCatalog(p.n);
      return inCat?`<button class="chip pend ${sel.has(p.n)?'on':''}" data-a="${esc(p.n)}"><i class="spin"></i>${esc(p.n)}</button>`
        :`<button class="chip pend" data-p="${esc(p.n)}">${late?'⚠':'<i class="spin"></i>'}${esc(p.n)}</button>`}).join('');
}
function pendNote(){
  const late=pend.filter(p=>Date.now()-p.t>LATE||isRejected(p.n)), wait=pend.filter(p=>!late.includes(p));
  let h='';
  if(wait.length)h+=`<div class="note"><i class="spin"></i><div><b>${esc(wait.map(p=>p.n).join('、'))}</b> を調べています。フェスの出演情報はすぐ表示します。ツアーなどの詳しい情報は、通常1〜3分で追加されます（閉じても大丈夫です）。</div></div>`;
  if(late.length)h+=`<div class="note">⚠<div>登録できなかった可能性：<b>${esc(late.map(p=>p.n).join('、'))}</b>。音楽・ライブ活動が確認できない名前は登録されません。正式名称でもう一度お試しください（タップで一覧から消せます）。</div></div>`;
  return h;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('show'),5200)}
function openAdd(on){const b=$('#addbox');b.hidden=!on;if(on)setTimeout(()=>$('#addname').focus(),80)}
async function addArtist(name){
  name=name.trim().replace(/\s+/g,' ').slice(0,60);
  if(!name)return;
  if(/https?:|@|[\r\n]/i.test(name)){toast('名前だけを入力してください');return}
  const ex=findArtist(name);
  if(ex){toast('「'+ex+'」はすでに登録されています');$('#addname').value='';openAdd(false);sel=new Set([ex]);try{localStorage.sel=JSON.stringify([...sel])}catch{}go('live');return}
  if(pend.some(p=>nzName(p.n)===nzName(name))){toast('「'+name+'」は調査中です。しばらくお待ちください');return}
  if(isRejected(name)){toast('「'+name+'」は登録できませんでした（音楽・ライブ活動が確認できない名前）。正式名称でお試しください');return}
  if(pend.filter(p=>Date.now()-p.t<=LATE).length>=5){toast('一度に追加できるのは5組までです。反映されてから追加してください');return}
  $('#addgo').disabled=true;
  const ck=findCatalog(name), nm=ck||name; // カタログにいれば正式名で送る
  try{
    await fetch(FORM_POST,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:ENTRY+'='+encodeURIComponent(nm)});
    pend.push({n:nm,t:Date.now()});savePend();$('#addname').value='';openAdd(false);
    if(ck){sel=new Set([ck]);try{localStorage.sel=JSON.stringify([...sel])}catch{}}
    go('live');
    const n=ck?(CAT.artists[ck].events||[]).length:0;
    toast(ck?`「${ck}」を追加しました（フェス等の予定 ${n}件）。ツアーなど詳しい情報を調べています…`:'「'+name+'」を受け付けました。調べています…（通常1〜3分）');
    load(false);
  }catch(e){toast('送信できませんでした。通信を確認してもう一度お試しください')}
  $('#addgo').disabled=false;
}
const links=(o)=>{const t=safe(o.ticket_url),s=safe(o.source_url||o.official_url);
  return `<div class="links">${t?`<a class="btn" href="${t}" target="_blank" rel="noopener">${esc(o.ticket_name||'チケット')}　→</a>`:o.ticket_name?`<span class="m">${esc(o.ticket_name)}</span>`:''}${s?`<a class="lnk" href="${s}" target="_blank" rel="noopener">${o.official_url?'公式サイト':'情報元'}</a>`:''}</div>`};
function card(e,i){
  const k=KIND[e.kind]||e.kind||'';
  return `<article class="ev" style="animation-delay:${Math.min(i,10)*25}ms">${dateBlock(e.date)}
  <div><div class="tags">${k?`<span>${esc(k)}</span>`:''}<span class="who" style="--h:${hue(e.artist)}"><i class="dot"></i>${esc(e.artist)}</span>${soonBadge(e.date)}${e.confidence==='low'?'<span class="pill warn">要確認</span>':''}</div>
  <div class="t">${esc(e.title)}</div>
  ${e.venue?`<div class="m">${esc(e.venue)}</div>`:''}
  ${e.with?`<div class="m">with ${esc(e.with)}</div>`:''}
  ${e.sale_info?`<div class="m">${esc(e.sale_info)}</div>`:''}
  ${links(e)}</div></article>`}
let TAB='live';
try{if(localStorage.tab==='fes')TAB='fes'}catch{}
function fesCard(f,i){
  const nz=s=>String(s||'').toLowerCase().replace(/[\s'’"「」『』（）()【】!！?？・~〜-]/g,'');
  const fn=nz(f.name);
  const mine=allEv().filter(e=>{
    if(e.kind!=='フェス'||(e.date||'')<f.start||(e.date||'')>(f.end||f.start))return false;
    const en=nz(e.title);return fn.length>=4&&en.length>=4&&(en.includes(fn)||fn.includes(en)||en.includes(fn.slice(0,Math.max(4,fn.length-2))));
  });
  const who=[...new Set(mine.map(e=>e.artist))];
  const q='https://www.google.com/search?q='+encodeURIComponent(f.name+' 出演者 ラインナップ');
  const u=safe(f.official_url);
  return `<article class="ev" style="animation-delay:${Math.min(i,10)*25}ms">${dateBlock(f.start,f.end)}
  <div><div class="tags"><span>FES</span>${who.length?'<span class="pill solid">推しが出演</span>':''}${f.status==='lineup'?'<span class="pill dim">出演者発表済み</span>':''}${soonBadge(f.start)}</div>
  <div class="t">${esc(f.name)}</div>
  <div class="m">${esc([f.pref,f.venue].filter(Boolean).join('　'))}</div>
  ${who.length?`<div class="m" style="color:var(--fg)">${esc(who.join('、'))}</div>`:''}
  ${f.note?`<div class="m">${esc(f.note)}</div>`:''}
  <div class="links">${u?`<a class="btn" href="${u}" target="_blank" rel="noopener">公式サイト　→</a>`:''}<a class="lnk" href="${q}" target="_blank" rel="noopener">出演者を探す</a></div></div></article>`}
const upd=()=>DB.updated?new Date(DB.updated).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const foot=t=>`<div class="foot">最終更新 ${esc(upd())}<br>${t}</div>`;
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const monHead=k=>{const [y,m]=k.split('-');return `<div class="mon"><span class="bb n">${+m}</span><span class="j">月</span><span class="y">${MON[+m-1]} ${y}</span></div>`};
function renderFes(){
  const q=$('#q').value.trim().toLowerCase(),today=todayJ();
  const list=(DB.festivals||[]).filter(f=>(f.end||f.start||'')>=today&&(!q||JSON.stringify(f).toLowerCase().includes(q)))
    .sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  let h='',cur='',i=0;
  for(const f of list){const mo=(f.start||'').slice(0,7);if(mo!==cur){cur=mo;h+=monHead(mo)}h+=fesCard(f,i++)}
  out.innerHTML=(list.length?`<div class="count">開催予定のフェス ${list.length}件　推しが出る日は「推しが出演」と表示されます</div>${h}`:`<div class="empty"><div class="bb">NO FESTIVAL</div><p>該当するフェスはありません。キーワードを変えてみてください。</p></div>`)+
    foot('情報は自動収集です。最新の発表は公式サイトでご確認ください');
}
function render(){
  chips();
  document.querySelectorAll('#nav button[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===TAB));
  $('#hero').innerHTML=TAB==='fes'?'FESTIVAL<br>LINEUP':'LIVE<br>SCHEDULE';
  $('#herosub').textContent=TAB==='fes'?'開催予定のフェスを、自動で集めています':'推しのライブ・フェスを、まとめてキャッチ';
  $('#q').placeholder=TAB==='fes'?'フェス名・地名で探す':'会場・公演名・地名で探す';
  if(TAB==='fes'){$('#chips').style.display='none';$('#ctog').hidden=true;return renderFes()}
  $('#chips').style.display='';foldChips();
  const today=todayJ(),q=$('#q').value.trim().toLowerCase();
  const list=allEv().filter(e=>(e.date||'9999')>=today&&(!sel.size||sel.has(e.artist))&&(!q||JSON.stringify(e).toLowerCase().includes(q)))
    .sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  let h='',cur='',i=0;
  for(const e of list){const mo=(e.date||'').slice(0,7)||'未定';if(mo!==cur){cur=mo;h+=/\d/.test(mo)?monHead(mo):'<div class="mon"><span class="j">日付未定</span></div>'}h+=card(e,i++)}
  const none=(sel.size&&!q)?`<div class="empty"><div class="bb">NO SCHEDULE</div><p>${esc([...sel].join('、'))} の予定は、まだ見つかっていません。公式サイトで発表されると、自動で追加されます（毎日確認しています）。</p></div>`
    :`<div class="empty"><div class="bb">NO RESULT</div><p>該当するライブはありません。キーワードや、推しの選択を変えてみてください。</p></div>`;
  out.innerHTML=(list.length?`<div class="count">${list.length}件のライブ・フェス</div>${h}`:none)+pendNote()+
    foot('AIによる自動収集です。購入前に、必ず公式の情報をご確認ください');
}
function go(t){TAB=t;try{localStorage.tab=t}catch{}render();scrollTo({top:0})}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.p!==undefined){const p=pend.find(x=>x.n===d.p);if(p&&(Date.now()-p.t>LATE||isRejected(p.n))&&confirm(`「${p.n}」を一覧から消しますか？（もう一度追加できます）`)){pend=pend.filter(x=>x!==p);savePend();render()}return}
  const a=d.a;if(a===undefined)return;
  if(a==='')sel.clear();else sel.has(a)?sel.delete(a):sel.add(a);
  try{localStorage.sel=JSON.stringify([...sel])}catch{}render()};
$('#q').oninput=render;
$('#ctog').onclick=()=>{OPEN=!OPEN;try{localStorage.copen=OPEN?'1':'0'}catch{}render()};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render()); // フォントが読み込まれたら、折り返しを測り直す
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.nav;if(n==='add')openAdd(true);else if(n)go(n)};
$('#addbox').onclick=e=>{if(e.target.closest('[data-close]'))openAdd(false)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')openAdd(false)});
$('#addform').onsubmit=e=>{e.preventDefault();addArtist($('#addname').value)};
function load(first){
  return fetch('data/events.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    DB=j;fillSug();
    // 調べていた推しができあがったら、すぐ知らせて、その推しを表示する
    const done=pend.filter(p=>findArtist(p.n));
    if(done.length){
      const a=findArtist(done[0].n), n=DB.events.filter(e=>e.artist===a).length;
      sel=new Set([a]);try{localStorage.sel=JSON.stringify([...sel])}catch{}
      TAB='live';try{localStorage.tab='live'}catch{}
      toast(n?`「${a}」を追加しました（今後の予定 ${n}件）`:`「${a}」を追加しました（今後の予定は、いまのところ見つかっていません）`);
      scrollTo({top:0});
    }
    render();
  }).catch(()=>{if(first)out.innerHTML='<div class="empty"><div class="bb">OFFLINE</div><p>データを読み込めませんでした。通信を確認して、もう一度開いてください。</p></div>'});
}
load(true).then(loadCat);
// 調べている推しがあるうちは15秒ごと、ないときは5分ごとに最新へ
(function tick(){setTimeout(()=>{if(!document.hidden)load(false);tick()},pend.some(p=>Date.now()-p.t<=LATE)?15*1000:5*60*1000)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)}); // 戻ってきたときも最新へ
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
