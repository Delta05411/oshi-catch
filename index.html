<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推しキャッチ">
<meta name="description" content="推しのライブ・フェス・対バン情報を、まとめてキャッチ。">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:site_name" content="推しキャッチ">
<meta property="og:title" content="推しキャッチ｜推しのライブ・フェスをまとめてキャッチ">
<meta property="og:description" content="推しのライブ・フェス・対バン情報を、自動でまとめて一覧。">
<meta property="og:url" content="https://oshicatch.com/">
<meta property="og:image" content="https://oshicatch.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oshicatch.com/img/og.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<title>推しキャッチ</title>
<style>
:root{--bg:#0b0b0b;--fg:#f2f2f2;--sub:#9a9a9a;--line:#2e2e2e;--line2:#4a4a4a;--w:#fff;--warn:#f5c04a;--hl:68%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--w);outline-offset:3px}
.bb{font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;letter-spacing:.03em;font-weight:400}
.wm{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ヘッダー */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.94);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.logo{font-size:19px;line-height:1;color:var(--w);text-decoration:none}
#nav{display:flex;align-items:center;gap:20px}
#nav button{font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:.08em;color:var(--sub);padding:6px 0;border-bottom:1px solid transparent}
#nav button.on{color:var(--w);border-bottom-color:var(--w)}
#nav button.add{color:var(--bg);background:var(--w);padding:3px 12px 2px;border-radius:2px;border:0}

/* 見出し・検索・推し */
.hero{padding-top:30px}
.hero h1{margin:0;font-size:clamp(52px,16vw,92px);line-height:.92;color:var(--w)}
.hero p{margin:10px 0 0;font-size:13px;color:var(--sub)}
.search{display:block;margin-top:22px}
#q{width:100%;font-size:16px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;outline:none}
#q::placeholder{color:#777}
#q:focus{border-bottom-color:var(--w)}
.chips{display:flex;flex-wrap:wrap;gap:10px 18px;margin:18px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);padding:3px 0;border-bottom:1px solid transparent;text-align:left;line-height:1.35}
.chip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,0) 85% var(--hl));flex:none}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--w);border-bottom-color:var(--w)}
.chip.pend{font-style:normal;border-bottom:1px dashed var(--line2)}
.chips.fold{max-height:66px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
#ctog{display:block;margin:6px 0 0;font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:.1em;color:var(--w);padding:4px 0;border-bottom:1px solid var(--w)}
#ctog[hidden]{display:none}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--w);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

#cedit{display:block;margin:10px 0 0;font-size:12px;color:var(--sub);padding:2px 0;border-bottom:1px solid var(--line2);letter-spacing:.04em}
#cedit[hidden]{display:none}
.chip .rm{margin-left:4px;color:var(--warn);font-weight:700}
.chip .ed{margin-left:6px;color:var(--w);font-weight:400}

/* 一覧 */
main{padding-bottom:70px}
.count{font-size:12px;color:var(--sub);margin:22px 0 0;letter-spacing:.04em}
.mon{display:flex;align-items:baseline;gap:10px;margin:34px 0 0;padding-bottom:8px;border-bottom:1px solid var(--w)}
.mon .n{font-size:40px;line-height:1;color:var(--w)}
.mon .j{font-size:14px;font-weight:700}
.mon .y{margin-left:auto;font-size:12px;color:var(--sub);letter-spacing:.08em}
.ev{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.date .dy{font-size:44px;line-height:.9;color:var(--w)}
.date .ym{font-size:10.5px;color:var(--sub);margin-top:5px;letter-spacing:.06em;line-height:1.35}
.date .to{font-size:11px;color:var(--sub);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;color:var(--sub);letter-spacing:.04em;margin-bottom:2px}
.tags .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,0) 85% var(--hl));display:inline-block;margin-right:6px;vertical-align:1px}
.tags .who{color:var(--fg);font-size:12px}
.pill{font-size:10.5px;padding:0 7px;border:1px solid var(--w);color:var(--w);border-radius:2px;line-height:1.7;letter-spacing:.04em}
.pill.solid{background:var(--w);color:var(--bg);font-weight:700}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.dim{border-color:var(--line2);color:var(--sub)}
.t{font-size:16px;font-weight:700;line-height:1.4;margin:3px 0 3px;color:var(--w);word-break:break-word}
.m{font-size:12.5px;color:var(--sub);margin:1px 0;word-break:break-word}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px}
.btn{display:inline-block;font-size:12.5px;color:var(--w);text-decoration:none;border:1px solid var(--w);padding:5px 14px;border-radius:2px;letter-spacing:.03em}
.btn:hover,.btn:active{background:var(--w);color:var(--bg)}
.lnk{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.empty{padding:50px 0 30px}
.empty .bb{font-size:52px;line-height:1;color:var(--w)}
.empty p{margin:8px 0 0;font-size:13px;color:var(--sub)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--sub);border:1px dashed var(--line2);padding:11px 12px;margin:22px 0 0;border-radius:2px}
.note b{color:var(--fg);font-weight:700}
.foot{font-size:11.5px;color:#777;margin:34px 0 0;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
.sk{height:96px;margin:0;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b0b0b 25%,#161616 37%,#0b0b0b 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

#seg{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-top:20px;border-bottom:1px solid var(--line)}
#seg button{flex:none;font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:.08em;color:var(--sub);padding:4px 0 3px;border-bottom:2px solid transparent;margin-bottom:-1px}
#seg button.on{color:var(--w);border-bottom-color:var(--w)}
.sale{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--fg);margin-top:6px}
.sale a{color:var(--fg);text-underline-offset:3px}
select.st{display:block;margin-top:12px;font:inherit;font-size:12px;color:var(--sub);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:4px 8px;max-width:100%}
select.st.has{color:var(--bg);background:var(--w);border-color:var(--w);font-weight:700}
select.st.s3{background:transparent;color:var(--sub);border-color:var(--line2);text-decoration:line-through}
select.st option{color:#000;background:#fff}
details.lu{margin-top:8px;font-size:12.5px}
details.lu summary{cursor:pointer;color:var(--fg);padding:2px 0;list-style:none}
details.lu summary::before{content:"+ ";color:var(--w)}
details.lu[open] summary::before{content:"− "}
details.lu div{margin-top:6px;color:var(--sub);line-height:1.9;word-break:break-word}
details.lu b{color:var(--w)}
details.lu i{font-style:normal;color:var(--line2);margin:0 6px}
.note.due{border-style:solid;border-color:var(--warn);color:var(--fg)}

/* 推しを追加（下から出るシート） */
#addbox{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#addbox[hidden]{display:none}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.72);animation:fade .2s}
@keyframes fade{from{opacity:0}}
#addform{position:relative;width:100%;max-width:560px;padding:22px 20px calc(24px + env(safe-area-inset-bottom));background:var(--bg);border:1px solid var(--line2);border-bottom:0;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#addform h2{margin:0;font-size:38px;line-height:1;color:var(--w)}
#addform p{margin:8px 0 18px;font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:14px;align-items:flex-end}
#addname{flex:1;min-width:0;font-size:16px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;outline:none}
#addname:focus,#addhint:focus{border-bottom-color:var(--w)}
#addhint{flex:1;min-width:0;font-size:16px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;outline:none}
#hintrow{margin-top:6px}
#addgo{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.08em;color:var(--bg);background:var(--w);padding:4px 24px 2px;border-radius:2px}
#addgo:disabled{opacity:.5}
#pick{margin-top:18px}
#pick .pk{font-size:12px;color:var(--sub)}
#pick .chips{margin:10px 0 0;max-height:150px;overflow:auto}
#amode{display:flex;gap:16px;margin:12px 0 4px}
#amode button{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:.08em;color:var(--sub);border-bottom:2px solid transparent}
#amode button.on{color:var(--w);border-bottom-color:var(--w)}
#mnav{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:4;display:flex;gap:4px 18px;overflow-x:auto;padding:10px 0 9px;margin-top:14px;background:rgba(11,11,11,.96);border-bottom:1px solid var(--line);scrollbar-width:none}
#mnav::-webkit-scrollbar{display:none}
#mnav button{flex:none;font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:.06em;color:var(--sub);white-space:nowrap}
#mnav button:active,#mnav button:hover{color:var(--w)}
#mnav small{font-size:10px;margin-left:3px;color:var(--sub);vertical-align:top}
.mon{scroll-margin-top:112px}
.strow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.calh .bb{font-size:44px;line-height:1;color:var(--w)}
.calh button{font-size:30px;line-height:1;color:var(--w);padding:2px 14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-top:10px;background:var(--line);border:1px solid var(--line)}
.cw{background:var(--bg);font-size:10px;color:var(--sub);text-align:center;padding:4px 0;letter-spacing:.06em}
.cw.su{color:#e06a6a}.cw.sa{color:#6fa8e0}
.cd{background:var(--bg);min-height:68px;padding:3px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;overflow:hidden}
.cd.e{min-height:0}
.cd b{font-size:11px;font-weight:400;color:var(--sub);padding:0 2px}
.cd.today b{color:var(--bg);background:var(--w);border-radius:2px;align-self:flex-start;padding:0 4px}
.cd.sel{outline:1px solid var(--w);outline-offset:-1px}
.ci{display:block;font-style:normal;font-size:9.5px;line-height:1.25;padding:1px 3px;border-left:3px solid #888;background:#1a1a1a;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci.s0{border-color:#888}.ci.s1{border-color:var(--warn)}.ci.s2{border-color:#7ddf7d}.ci.s3{border-color:#555;color:#777;text-decoration:line-through}.ci.s4{border-color:#fff}.ci.s5{border-color:#6fb3ff}
.cd u{font-size:9.5px;color:var(--sub);text-decoration:none;padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--sub)}
.legend .ci{display:inline-block;width:10px;height:10px;padding:0;vertical-align:-1px;margin-right:4px;background:none;border-left-width:3px}
.help{padding-top:6px}
.help h3{font-size:30px;line-height:1;color:var(--w);margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.help h3.warnh{color:var(--warn)}
.help p{font-size:13.5px;color:var(--fg);margin:8px 0}
.hl{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.hl b{font-size:14px;color:var(--w)}
.hl span{font-size:13px;color:var(--sub);line-height:1.75}
.hl span b{font-size:13px;color:var(--fg)}
.hl.warnb{border:1px solid var(--warn);padding:12px;margin-top:6px}
.hl.warnb b:first-child{color:var(--warn)}
.help textarea{width:100%;margin-top:10px;font:inherit;font-size:12.5px;color:var(--fg);background:#111;border:1px solid var(--line2);border-radius:2px;padding:8px;resize:vertical}
.x{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;color:var(--sub);padding:4px 8px}
#toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;max-width:min(92vw,520px);background:var(--w);color:var(--bg);padding:12px 18px;border-radius:2px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo wm" href="./" aria-label="推しキャッチ">推しキャッチ</a>
    <nav id="nav" aria-label="メニュー">
      <button data-nav="add" class="add" aria-label="推しを追加">+ ADD</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1 class="bb" id="hero">LIVE<br>SCHEDULE</h1>
    <p id="herosub">推しのライブ・フェスを、まとめてキャッチ</p>
    <div id="seg" role="tablist"><button data-seg="all">ALL</button><button data-seg="live">LIVE</button><button data-seg="fes">FES</button><button data-seg="mine">MY LIST</button><button data-seg="cal">MY CAL</button><button data-seg="help">HELP</button></div>
    <label class="search"><input id="q" type="search" placeholder="会場・公演名・地名で探す" autocomplete="off" aria-label="検索"></label>
    <div class="chips" id="chips" role="group" aria-label="推しで絞り込み"></div>
    <button type="button" id="ctog" hidden></button>
    <button type="button" id="cedit" hidden>EDIT 推しの名前・削除</button>
  </section>
  <main id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
</div>

<div id="addbox" hidden>
  <div class="bg" data-close></div>
  <form id="addform">
    <button type="button" class="x" data-close aria-label="閉じる">×</button>
    <h2 class="bb">ADD ARTIST</h2>
    <div id="amode"><button type="button" data-m="a" class="on">ARTIST</button><button type="button" data-m="l">LIVE</button><button type="button" data-m="f">FES</button></div>
    <p id="addhelp">候補から選ぶと、すぐ表示されます。候補にない人は調べるので、1〜3分ほどかかります。</p>
    <div class="row"><input id="addname" list="sug" maxlength="60" placeholder="アーティスト名" autocomplete="off" enterkeyhint="send"><datalist id="sug"></datalist><button id="addgo" type="submit">ADD</button></div>
    <div class="row" id="hintrow" hidden><input id="addhint" maxlength="40" placeholder="日付や公演名（例：11/10,11 ワンマン）" autocomplete="off" enterkeyhint="send"></div>
    <div id="pick"></div>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s), out=$('#out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?u:'';
const WE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const KIND={'フェス':'FES','ワンマン':'ONE MAN','対バン':'TAIBAN','イベント':'EVENT','その他':'OTHER'};
let DB={artists:[],events:[]}, sel=new Set();
// 自分の推し（この端末だけに保存）。共通データには、全員が追加した推しが入っている
let MYART=null;try{const j=localStorage.myart;if(j)MYART=new Set(JSON.parse(j))}catch{}
const saveMA=()=>{try{localStorage.myart=JSON.stringify([...MYART])}catch{}};
const addMy=a=>{if(!MYART)MYART=new Set();MYART.add(a);saveMA()};
const mineA=()=>DB.artists.filter(a=>MYART&&MYART.has(a));
let EDIT=false;
let ADDMODE='a'; // a=アーティスト / f=フェス
// 推しの表示名（自分用）。大文字小文字・THE の有無など、好きな表記に直せる。検索・データは元の名前のまま
let NM={};try{NM=JSON.parse(localStorage.nm||'{}')}catch{}
const saveNM=()=>{try{localStorage.nm=JSON.stringify(NM)}catch{}};
const dn=a=>NM[a]||a;
try{sel=new Set(JSON.parse(localStorage.sel||'[]'))}catch{}
// 推しごとの目印の色（名前から決める。同じ名前はいつも同じ色）
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const todayJ=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10); // 日本時間の今日
function dinfo(d){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||'');if(!m)return null;
  const y=+m[1],mo=+m[2],dy=+m[3],t=/^(\d{4})-(\d\d)-(\d\d)$/.exec(todayJ());
  const left=Math.round((Date.UTC(y,mo-1,dy)-Date.UTC(+t[1],+t[2]-1,+t[3]))/864e5);
  return {y,mo,dy,w:new Date(y,mo-1,dy).getDay(),left}}
function dateBlock(d,end){
  const i=dinfo(d);if(!i)return `<div class="date"><div class="bb dy" style="font-size:26px">TBA</div><div class="ym">日付未定</div></div>`;
  let to='';const j=end&&end!==d?dinfo(end):null;
  if(j)to=`<div class="to">〜 ${j.mo===i.mo?'':j.mo+'/'}${j.dy}</div>`;
  return `<div class="date"><div class="bb dy">${i.dy}</div><div class="ym">${i.y}.${String(i.mo).padStart(2,'0')}<br>${WE[i.w]}</div>${to}</div>`;
}
function soonBadge(d){const i=dinfo(d);if(!i)return'';if(i.left===0)return '<span class="pill solid">TODAY</span>';if(i.left>0&&i.left<=14)return `<span class="pill">あと${i.left}日</span>`;return''}
// 推し追加：この画面から送信する（Googleフォームの受付口へ直接送る。別画面には移動しない）。
const FORM_POST='https://docs.google.com/forms/d/e/1FAIpQLScyDwwYaorGtzIDbylyTZa8qPfOZapT8wkfYOPNODXN4mmVBA/formResponse';
const ENTRY='entry.822980878';
let pend=[];try{pend=JSON.parse(localStorage.pend||'[]').map(p=>typeof p==='string'?{n:p,t:Date.now()}:p)}catch{}

function build(tab,q,today){
  const evs=allEv().filter(e=>(e.date||'9999')>=today), res=[];
  const hit=o=>!q||JSON.stringify(o).toLowerCase().includes(q);
  const fl=(DB.festivals||[]).filter(f=>f.tba||(f.end||f.start||'')>=today);
  const absorbed=new Set();
  const pushF=(f,m)=>{if(!f.start){res.push({f,m:[],day:'',d:'9999-TBA'});return}const ds=fesDays(f).filter(d=>d>=today);for(const d of (ds.length?ds:[f.start]))res.push({f,m,day:d,d})};
  if(tab==='fes'){for(const f of fl)if(hit(f))pushF(f,fesMine(f,evs));}
  else if(tab!=='live'){
    for(const f of fl){const m=fesMine(f,evs),mk=fesMarked(f);
      const ok=tab==='mine'?!!mk:(m.some(e=>!sel.size||sel.has(e.artist))||!!mk);
      if(!ok||!hit(f)&&!hit(m))continue;
      m.forEach(e=>absorbed.add(e));
      if(tab==='mine'){for(const d of fesDays(f))if((d>=today||!f.start)&&(MY[dayKey(f,d)]||MY[fesKey(f)]))res.push({f,m,day:d,d:d||'9999-TBA'})}
      else pushF(f,m)}
  }
  if(tab!=='fes')for(const e of evs){
    if(absorbed.has(e)||(sel.size&&!sel.has(e.artist)))continue;
    if(tab==='mine'&&!MY[keyOf(e)])continue;
    if(!hit(e))continue;res.push({e,d:e.date||'9999'})}
  return res.sort((a,b)=>a.d.localeCompare(b.d));
}

  if(e.target.closest('#bkmake')){$('#bkout').value=bkMake();return}
  if(e.target.closest('#bkcopy')){const t=$('#bkout');if(!t.value)t.value=bkMake();t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('コピーしました。LINEなどに貼りつけて、自分に送っておいてください')).catch(()=>{try{document.execCommand('copy');toast('コピーしました')}catch{toast('コードを長おしして、コピーしてください')}});return}
  if(e.target.closest('#bkload')){const er=bkLoad($('#bkin').value);if(er){toast(er);return}toast('読みこみました。推しと記録が引き継がれました');go('all');return}
if(e.target.closest('[data-fx]')){e.preventDefault();FP=FP.filter(p=>Date.now()-p.t<=LATE&&!isRejected(p.n));saveFP();render()}});
out.addEventListener('change',e=>{const s=e.target.closest('select.st');if(!s)return;
  const k=s.dataset.k,v=s.value;if(v)MY[k]=v;else delete MY[k];saveMy();if(v)refreshSnap();else{delete SNAP[k];saveSnap()}
  s.className='st'+(v?' has s'+ST.indexOf(v):'');
  render();toast(v?`「${v}」で記録しました（この端末に保存）`:'記録を消しました')});
function go(t){TAB=t;try{localStorage.tab2=t}catch{}render();scrollTo({top:0})}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.p!==undefined){const p=pend.find(x=>x.n===d.p);if(p&&(Date.now()-p.t>LATE||isRejected(p.n))&&confirm(`「${p.n}」を一覧から消しますか？（もう一度追加できます）`)){pend=pend.filter(x=>x!==p);savePend();render()}return}
  const ed=e.target.closest('.ed');
  if(ed){const a0=ed.dataset.e,cur=dn(a0),v=prompt('表示名を変更（この端末だけに反映。空にすると元に戻ります）',cur);
    if(v!==null){const t=v.trim().slice(0,60);if(t&&t!==a0)NM[a0]=t;else delete NM[a0];saveNM();render()}return}
  const a=d.a;if(a===undefined)return;
  if(EDIT){if(a){MYART.delete(a);sel.delete(a);saveMA();try{localStorage.sel=JSON.stringify([...sel])}catch{}toast('「'+a+'」を外しました。+ ADD で、またすぐ戻せます');render()}return}
  if(a==='')sel.clear();else sel.has(a)?sel.delete(a):sel.add(a);
  try{localStorage.sel=JSON.stringify([...sel])}catch{}render()};
$('#q').oninput=render;
$('#cedit').onclick=()=>{EDIT=!EDIT;render()};
$('#ctog').onclick=()=>{OPEN=!OPEN;try{localStorage.copen=OPEN?'1':'0'}catch{}render()};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render()); // フォントが読み込まれたら、折り返しを測り直す
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav==='add')openAdd(true)};
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.seg)go(b.dataset.seg)};
$('#pick').onclick=e=>{const b=e.target.closest('[data-pick]');if(b)addArtist(b.dataset.pick,true)};
$('#amode').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('#addbox').onclick=e=>{if(e.target.closest('[data-close]'))openAdd(false)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')openAdd(false)});
$('#addform').onsubmit=e=>{e.preventDefault();addArtist($('#addname').value)};
function load(first){
  return fetch('data/events.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    DB=j;fillSug();
    if(MYART===null){let old=false;try{const g=k=>localStorage.getItem(k);old=['tab','tab2','copen','my','sel','pend'].some(k=>g(k)!==null)}catch{}
      MYART=new Set(old?DB.artists:[]);saveMA()}
    else if(MYART.size===0){try{if(!localStorage.getItem('mig2')){localStorage.mig2='1';if(['tab','tab2','copen','my','sel'].some(k=>localStorage.getItem(k)!==null)){MYART=new Set(DB.artists);saveMA()}}}catch{}} // 初版の判定漏れの救済（1回だけ）
    // 調べていた推しができあがったら、すぐ知らせて、その推しを表示する
    refreshSnap();
    const fdone=FP.filter(p=>findFes(p.n));
    if(fdone.length){fdone.forEach(p=>{const f=findFes(p.n);if(!fesMarked(f))fesDays(f).forEach(d=>{MY[dayKey(f,d)]='検討中'})});saveMy();
      FP=FP.filter(p=>!findFes(p.n));saveFP();toast('フェス「'+findFes(fdone[0].n).name+'」を追加しました（日程・出演者・受付期間）');
      TAB='all';try{localStorage.tab2='all'}catch{}}
    const done=pend.filter(p=>findArtist(p.n));
    if(done.length){
      done.forEach(p=>addMy(findArtist(p.n)));
      const a=findArtist(done[0].n), n=DB.events.filter(e=>e.artist===a).length;
      sel=new Set([a]);try{localStorage.sel=JSON.stringify([...sel])}catch{}
      TAB='all';try{localStorage.tab2='all'}catch{}
      toast(n?`「${a}」を追加しました（今後の予定 ${n}件）`:`「${a}」を追加しました（今後の予定は、いまのところ見つかっていません）`);
      scrollTo({top:0});
    }
    render();
  }).catch(()=>{if(first)out.innerHTML='<div class="empty"><div class="bb">OFFLINE</div><p>データを読み込めませんでした。通信を確認して、もう一度開いてください。</p></div>'});
}
load(true).then(loadCat);
// 調べている推しがあるうちは15秒ごと、ないときは5分ごとに最新へ
(function tick(){setTimeout(()=>{if(!document.hidden)load(false);tick()},pend.concat(FP,LV).some(p=>Date.now()-p.t<=LATE)?15*1000:5*60*1000)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)}); // 戻ってきたときも最新へ
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
